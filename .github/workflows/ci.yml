name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Lint
        id: lint
        run: npm run lint

      - name: Set up Reviewdog
        if: ${{ failure() && github.event_name == 'pull_request' && steps.lint.outcome == 'failure' }}
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.0

      - name: Annotate lint findings
        if: ${{ failure() && github.event_name == 'pull_request' && steps.lint.outcome == 'failure' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          npm run --silent lint:report |
            reviewdog -f=rdjson -reporter=github-pr-annotations -filter-mode=added -fail-level=none

      - name: Check formatting
        if: ${{ !cancelled() && steps.lint.outcome != 'skipped' }}
        run: npm run format:check

      - name: Run Ruff check
        if: ${{ !cancelled() && steps.lint.outcome != 'skipped' }}
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "check ."

      - name: Check Ruff formatting
        if: ${{ !cancelled() && steps.lint.outcome != 'skipped' }}
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: "format --check ."
